# Recompiler input for default.xbe (Galleon, original Xbox)
#
# Written by tools/build: xbe_symbols on the Galleon xbe, with [abi] transplanted from Black's config (the XDK 5849
# library functions the port calls by name behave the same), the two entries whose targets Galleon has no image for
# dropped, and the hooks gone: they were Black's addresses for Black's image, and Galleon's game code needs none to
# build or run, only [symbols] and [data] for the library calls the host replaces.

[xbe]
path = "assets/default.xbe"
title = 0x534e0002
entry = 0x1b1504
xdk = 5849
out = "generated/game"
partitions = 64
code_sections = [".text", "D3D", "XGRPH", "DSOUND", "XPP"]
# log each call of these functions (caller, arguments) and its eax: v1.0.6 diagnostic tracing for the
# SIGSEGV at guest address 0 (galleon-crash-4.log), the texture setup chain around 0x1BC3A0
trace = []

# extra entry points
[functions]

