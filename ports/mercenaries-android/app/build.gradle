plugins { id 'com.android.application' }
android {
    namespace 'com.mercrecomp'
    compileSdk 34
    ndkVersion '26.3.11579264'
    defaultConfig {
        applicationId 'com.mercrecomp.mercenaries'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1-shell'
        ndk { abiFilters 'arm64-v8a' }      // ARM64 only: the MMIO trap decodes AArch64
        externalNativeBuild { cmake {
            arguments "-DANDROID_STL=none"
            if (project.hasProperty('mercGenDir')) arguments "-DMERC_GEN_DIR=${project.property('mercGenDir')}"
        } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    packagingOptions { jniLibs { useLegacyPackaging = false } }
}
