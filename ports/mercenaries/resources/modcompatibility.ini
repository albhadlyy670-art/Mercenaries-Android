; Set these options to 1 when using expansive mods.
[Mods]
extended_graphics_memory=0
expanded_world_properties=0

; Optional gameplay extensions. See docs/MOD_EXTENSIONS.md.
faction_support=0
impact_stun_ammo=0
extra_grenade_slot=0

custom_voice_packs=0
exops_followers=0
permanent_contract_failure=0
throwable_c4=0
permadeath=0

; Set save_profile in the MOD's configuration, not the vanilla installation.
; [Permadeath]
; save_profile=my_mod
